[package]
name = "glass_notes"
version = "0.2.0"
description = "A bunch of sticky notes paste on a ground glass"
authors = ["Scour Fan"]
edition = "2021"

[lib]
name = "glass_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSResponder", "NSView", "NSWindow", "NSScreen", "NSGraphics", "NSVisualEffectView"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSThread", "NSGeometry"] }
raw-window-handle = "0.6"

[profile.release]
panic= "abort"
codegen-units = 1
